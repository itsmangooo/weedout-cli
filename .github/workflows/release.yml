# Cross-compile on a `v*` tag and attach the binaries to a GitHub Release.
#
# One job matrixed over platforms rather than one job per platform: the build
# is seconds of pure Go with no cgo, so the matrix overhead would exceed the
# work. `CGO_ENABLED=0` is what makes the Linux binaries static, so they run on
# Alpine and distroless images as well as glibc ones — CI containers are where
# this tool actually lives.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      # Tests before binaries. A release that fails its own suite should not
      # exist as a downloadable artefact, even briefly.
      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # The tag is the version. If they disagree, `weedout version` would
      # report something that does not match the release it came from, and the
      # first bug report against it would be unreproducible.
      - name: Tag matches nothing it can contradict
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Building ${GITHUB_REF_NAME}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="0.0.0-dev+${GITHUB_SHA::7}"

          name="weedout-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist

          # -s -w strips the symbol table and DWARF: this is a CLI nobody
          # debugs from a core dump, and it roughly halves the download.
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/itsmangooo/weedout-cli/internal/cli.Version=${version}" \
            -o "dist/${name}" .

          echo "ARTIFACT=dist/${name}" >> "$GITHUB_ENV"

      # Checksums per artefact, concatenated into one file by the release step.
      # Published so an install script can verify what it downloaded rather
      # than trusting the transport alone.
      - name: Checksum
        run: |
          cd dist
          sha256sum "$(basename "${ARTIFACT}")" > "$(basename "${ARTIFACT}").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: weedout-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          cat dist/*.sha256 > dist/checksums.txt
          rm -f dist/*.sha256
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
