# Publish weedout-cli to PyPI on a version tag.
#
# ⚠ THIS FILE'S NAME IS PART OF THE CREDENTIAL.
#
# There is no API token in this repository or in its secrets. PyPI is configured
# to trust a specific workflow, identified by repository *and filename*, and
# exchanges a short-lived OIDC token for upload rights. The registration must
# read exactly:
#
#   PyPI → weedout-cli → Manage → Publishing → Trusted publisher
#     Owner:          itsmangooo
#     Repository:     weedout-cli
#     Workflow name:  publish.yml      ← must equal this file's name
#     Environment:    (leave empty)    ← this workflow declares none
#
# If it still points at the old monorepo (itsmangooo/weedout, or a different
# workflow filename), the upload fails with "not a trusted publisher" and
# retrying will never help. Fix it on pypi.org, not here.
#
# First release: the project does not exist on PyPI yet, so there is nothing to
# attach a publisher to. Register a *pending* publisher instead —
# PyPI → Account settings → Publishing → Add a pending publisher — with the same
# values and project name `weedout-cli`.

name: Publish

on:
  push:
    tags:
      - "v*"
  # Build and smoke-test without publishing, to check a release will work
  # before committing a tag to it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The tag names the release publicly; the wheel's version is what people
      # actually install. If they disagree, either PyPI rejects the upload as a
      # duplicate or `v0.2.0` ships a wheel that reports something else.
      # Checked before building, so a mistake costs seconds rather than a
      # version number — those are only usable once.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION package=$PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version in pyproject.toml ($PACKAGE_VERSION). Bump it or retag."
            exit 1
          fi

      # `dist/` is gitignored, but a checkout is not guaranteed to be empty in
      # every runner configuration. Uploading a stale artefact alongside a fresh
      # one fails the release, so start from nothing.
      - name: Clean dist
        run: rm -rf dist

      - name: Build
        run: python -m build

      # A README that renders badly on PyPI cannot be fixed after upload.
      - name: Check metadata renders
        run: python -m twine check --strict dist/*

      # Prove the artefact installs and the console script runs, in a venv with
      # nothing else in it — before it is published rather than after.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/weedout --version
          /tmp/smoke/bin/weedout --help
          echo "--- installed packages (weedout-cli must bring nothing with it) ---"
          /tmp/smoke/bin/python -m pip list --format=freeze

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Tags only. A manual run builds and smoke-tests but publishes nothing, so
    # it is safe to use as a rehearsal.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      # The OIDC token PyPI exchanges for short-lived upload rights. This is the
      # whole reason no API token is needed. Scoped to this job alone — the
      # build job above cannot mint one.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
